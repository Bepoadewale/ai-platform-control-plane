name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - run: make lint
      - run: make test
      - run: pip-audit
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
      - run: opa test platform/policies tests/policy
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform/environments/aws init -backend=false
      - run: terraform -chdir=infrastructure/terraform/environments/aws validate
      - uses: azure/setup-helm@v4
      - run: helm lint platform/helm/golden-path
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: ., severity: HIGH,CRITICAL, exit-code: "1"}
      - run: docker build -t ai-platform-control-plane:ci -f control-plane/Dockerfile .
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: ai-platform-control-plane:ci, format: table, exit-code: "1", severity: HIGH,CRITICAL}
      - uses: anchore/sbom-action@v0
        with: {path: ., format: spdx-json}
