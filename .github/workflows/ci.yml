name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: node --test operator-console/tests
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - run: make lint
      - run: make test
      - run: pip-audit
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
      - run: opa test platform/policies tests/policy
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform/environments/aws init -backend=false
      - run: terraform -chdir=infrastructure/terraform/environments/aws validate
      - run: terraform -chdir=infrastructure/terraform/pilot init -backend=false
      - run: terraform -chdir=infrastructure/terraform/pilot validate
      - run: jq -e . infrastructure/terraform/pilot/aws-load-balancer-controller-policy-v3.5.0.json >/dev/null
      - run: bash -n scripts/pilot-cloud-bootstrap-runtime.sh scripts/pilot-cloud-alb.sh scripts/pilot-cloud-alb-smoke.sh scripts/pilot-cloud-runtime-smoke.sh scripts/pilot-cloud-destroy.sh
      - uses: azure/setup-helm@v4
      - run: helm lint platform/helm/golden-path
      - run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm template aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system --version 3.5.0 \
            --set clusterName=ai-platform-control-plane-pilot \
            --set region=us-east-1 \
            --set vpcId=vpc-0123456789abcdef0 \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\\.amazonaws\\.com/role-arn"=arn:aws:iam::654654474502:role/ai-platform-control-plane-pilot-aws-load-balancer-controller \
            >/dev/null
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1"}
      - run: docker build -t ai-platform-control-plane:ci -f control-plane/Dockerfile .
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: ai-platform-control-plane:ci, format: table, exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: "true"}
      - uses: anchore/sbom-action@v0
        with: {path: ., format: spdx-json}
