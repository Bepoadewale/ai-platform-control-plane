alertmanager:
  enabled: false
pushgateway:
  enabled: false
server:
  persistentVolume:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
extraScrapeConfigs: |
  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets: [control-plane.platform-system.svc.cluster.local:8000]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector.platform-system.svc.cluster.local:8889]
