alertmanager:
  enabled: false
pushgateway:
  enabled: false
server:
  persistentVolume:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # This chart expects extra scrape configuration beneath `server`; keeping it
  # here makes the running cloud pilot collect control-plane evidence rather
  # than merely deploying Prometheus.
  extraScrapeConfigs: |
    - job_name: control-plane
      metrics_path: /metrics
      static_configs:
        - targets: [control-plane.platform-system.svc.cluster.local:8000]
    - job_name: otel-collector
      static_configs:
        - targets: [otel-collector.platform-system.svc.cluster.local:8889]
