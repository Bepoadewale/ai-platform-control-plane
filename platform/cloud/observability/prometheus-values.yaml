alertmanager:
  enabled: true
  persistence:
    # The disposable pilot has no EBS CSI driver or default StorageClass. Alert
    # history is intentionally ephemeral for this bounded validation run.
    enabled: false
  # The disposable pilot deliberately has no external receiver. The alert drill queries
  # Prometheus' firing state instead of sending synthetic alerts to people.
  config:
    global: {}
    route:
      receiver: discard
    receivers:
      - name: discard
pushgateway:
  enabled: false
server:
  persistentVolume:
    enabled: false
  global:
    # Short pilot cadence provides observable feedback without relying on an
    # arbitrary sleep in smoke validation.
    scrape_interval: 15s
    scrape_timeout: 5s
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
# This chart reads extraScrapeConfigs at the top level. It makes the running
# cloud pilot collect control-plane evidence rather than merely deploy Prometheus.
extraScrapeConfigs: |
  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets: [control-plane.platform-system.svc.cluster.local:8000]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector.platform-system.svc.cluster.local:8889]
serverFiles:
  alerting_rules.yml:
    groups:
      - name: ai-platform-control-plane-pilot
        rules:
          - alert: PilotCatalogAvailabilityErrorBudgetBurn
            expr: |
              (
                sum(rate(platform_http_requests_total{route="/api/v1/catalog",status_code=~"5.."}[2m]))
                /
                clamp_min(sum(rate(platform_http_requests_total{route="/api/v1/catalog"}[2m])), 1)
              ) > 0.01
            for: 30s
            labels:
              severity: page
              scope: pilot
            annotations:
              summary: Catalog availability error-budget burn in pilot
          - alert: PilotUnauthorizedRequestBurst
            expr: |
              sum(increase(platform_http_requests_total{route="/api/v1/catalog",status_code=~"401|403"}[1m])) >= 5
            for: 15s
            labels:
              severity: warning
              scope: pilot
            annotations:
              summary: Bounded unauthorized-request security drill detected
