apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  labels:
    app.kubernetes.io/name: opa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opa
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opa
          image: openpolicyagent/opa:1.20.2
          args: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/environment.rego"]
          ports:
            - name: http
              containerPort: 8181
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: policy
              mountPath: /policies/environment.rego
              subPath: environment.rego
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: platform-policy
---
apiVersion: v1
kind: Service
metadata:
  name: opa
spec:
  selector:
    app.kubernetes.io/name: opa
  ports:
    - name: http
      port: 8181
      targetPort: http
