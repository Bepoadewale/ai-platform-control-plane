# This Git-managed contract intentionally has no AWS account or role ARN. The
# project-scoped bootstrap creates the namespace-local IRSA-bound reader before Argo
# reconciles this SecretStore. That prevents a repository placeholder from overwriting
# the live cloud identity binding.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pilot-secrets-manager
  namespace: platform-system
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: pilot-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-credentials
  namespace: platform-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pilot-secrets-manager
    kind: SecretStore
  target:
    name: github-app-credentials
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: ai-platform-control-plane-pilot/gitops-publisher
        property: app-id
    - secretKey: installation-id
      remoteRef:
        key: ai-platform-control-plane-pilot/gitops-publisher
        property: installation-id
    - secretKey: private-key.pem
      remoteRef:
        key: ai-platform-control-plane-pilot/gitops-publisher
        property: private-key.pem
