# This resource is applied only after External Secrets Operator has been installed by the
# project-scoped bootstrap script. The namespace-local reader is the only Kubernetes
# identity trusted by the narrowly scoped IRSA role; it reads one pilot GitHub App
# credential and creates a namespace-local Secret for the worker.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pilot-secrets-reader
  namespace: platform-system
  annotations:
    eks.amazonaws.com/role-arn: "${EXTERNAL_SECRETS_ROLE_ARN}"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pilot-secrets-manager
  namespace: platform-system
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: pilot-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-credentials
  namespace: platform-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pilot-secrets-manager
    kind: SecretStore
  target:
    name: github-app-credentials
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: ai-platform-control-plane-pilot/gitops-publisher
        property: app-id
    - secretKey: installation-id
      remoteRef:
        key: ai-platform-control-plane-pilot/gitops-publisher
        property: installation-id
    - secretKey: private-key.pem
      remoteRef:
        key: ai-platform-control-plane-pilot/gitops-publisher
        property: private-key.pem
