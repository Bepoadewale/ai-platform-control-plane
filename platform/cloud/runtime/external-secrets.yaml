# This resource is applied only after External Secrets Operator has been installed by the
# project-scoped bootstrap script. It reads one synthetic/pilot GitHub App credential from
# Secrets Manager and creates a namespace-local Kubernetes Secret for the worker.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pilot-secrets-manager
  namespace: platform-system
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-credentials
  namespace: platform-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pilot-secrets-manager
    kind: SecretStore
  target:
    name: github-app-credentials
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: ai-platform-control-plane-pilot/gitops-publisher
        property: app-id
    - secretKey: installation-id
      remoteRef:
        key: ai-platform-control-plane-pilot/gitops-publisher
        property: installation-id
    - secretKey: private-key.pem
      remoteRef:
        key: ai-platform-control-plane-pilot/gitops-publisher
        property: private-key.pem
