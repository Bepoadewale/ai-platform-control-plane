apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-console
  labels:
    app.kubernetes.io/name: operator-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operator-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator-console
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: operator-console
          image: 654654474502.dkr.ecr.us-east-1.amazonaws.com/ai-platform-control-plane:console-pilot-7b5eb1c
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: runtime-config, mountPath: /usr/share/nginx/html/runtime-config.js, subPath: runtime-config.js, readOnly: true}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: runtime-config
          configMap: {name: platform-public-runtime}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: operator-console
spec:
  selector:
    app.kubernetes.io/name: operator-console
  ports:
    - name: http
      port: 8080
      targetPort: http
