apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "golden-path.fullname" . }}
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "golden-path.fullname" . }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "golden-path.fullname" . }}}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "golden-path.fullname" . }}}
      annotations:
        platform.example/ttl-hours: {{ .Values.ttlHours | quote }}
    spec:
      serviceAccountName: {{ include "golden-path.fullname" . }}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      volumes:
        - name: runtime-tmp
          emptyDir: {}
      containers:
        - name: app
          image: {{ .Values.image }}
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
          resources: {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ include "golden-path.fullname" . | quote }}
          readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "golden-path.fullname" . }}, namespace: {{ .Values.namespace }}}
spec:
  selector: {app.kubernetes.io/name: {{ include "golden-path.fullname" . }}}
  ports: [{port: 80, targetPort: 8080}]
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "golden-path.fullname" . }}
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "golden-path.fullname" . }}, port: {number: 80}}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ .Values.namespace }}}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: v1
kind: LimitRange
metadata: {name: workload-defaults, namespace: {{ .Values.namespace }}}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: workload-quota, namespace: {{ .Values.namespace }}}
spec: {hard: {requests.cpu: "2", requests.memory: 2Gi, limits.cpu: "4", limits.memory: 4Gi, pods: "10"}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ include "golden-path.fullname" . }}, namespace: {{ .Values.namespace }}}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: {{ include "golden-path.fullname" . }}}}}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ include "golden-path.fullname" . }}, namespace: {{ .Values.namespace }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "golden-path.fullname" . }}}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.cpuUtilization }}}}
{{- end }}
