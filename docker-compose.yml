services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["platform-postgres:/var/lib/postgresql/data"]
  control-plane:
    build: {context: ., dockerfile: control-plane/Dockerfile}
    ports: ["8000:8000"]
    volumes: ["./environments:/app/environments"]
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform:local-development-only@postgres:5432/platform
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  platform-postgres: {}
