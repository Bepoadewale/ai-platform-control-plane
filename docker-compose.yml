services:
  opa:
    image: openpolicyagent/opa:1.20.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports: ["8181:8181"]
    volumes: ["./platform/policies:/policies:ro"]
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["platform-postgres:/var/lib/postgresql/data"]
  control-plane:
    build: {context: ., dockerfile: control-plane/Dockerfile}
    ports: ["8000:8000"]
    volumes: ["./environments:/app/environments", "./state:/app/state"]
    environment:
      PLATFORM_CONTROL_PLANE_DB: /app/state/control-plane.db
      PLATFORM_OPA_DECISION_URL: http://opa:8181/v1/data/platform/environment
    depends_on:
      postgres: {condition: service_healthy}
      opa: {condition: service_started}
volumes:
  platform-postgres: {}
